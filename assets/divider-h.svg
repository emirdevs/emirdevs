      <stop offset="0" stop-color="#34C997" stop-opacity="0"/>
      <stop offset=".15" stop-color="#34C997" stop-opacity=".45"/>
      <stop offset=".85" stop-color="#34C997" stop-opacity=".45"/>
      <stop offset="1" stop-color="#34C997" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#6EE7B7" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C6F6E3" stop-opacity="1"/>
