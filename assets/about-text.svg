<svg xmlns="http://www.w3.org/2000/svg" width="840" height="270" viewBox="0 0 840 270"><style>.t{fill:#E6EDF3}@media (prefers-color-scheme: light){.t{fill:#1F2328}}</style><text x="420.0" y="22" text-anchor="middle" fill="#8B8B92" font-size="17" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif"><tspan class="t" font-weight="700">Computer engineer &amp; software developer</tspan></text><text x="420.0" y="50" text-anchor="middle" fill="#8B8B92" font-size="17" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif"><tspan>building software that is </tspan><tspan class="t" font-weight="700">secure</tspan><tspan>, </tspan><tspan class="t" font-weight="700">scalable</tspan><tspan> and </tspan><tspan class="t" font-weight="700">reliable</tspan><tspan>.</tspan></text><text x="420.0" y="100" text-anchor="middle" fill="#8B8B92" font-size="17" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif"><tspan font-style="italic">Good software doesn&#x27;t just work — it delivers a secure, efficient</tspan></text><text x="420.0" y="128" text-anchor="middle" fill="#8B8B92" font-size="17" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif"><tspan font-style="italic">experience that adds real value for the people who use it.</tspan></text><text x="420.0" y="178" text-anchor="middle" fill="#8B8B92" font-size="17" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif"><tspan>I care about the details: a clear idea, a quiet interface, a fast experience.</tspan></text><text x="420.0" y="206" text-anchor="middle" fill="#8B8B92" font-size="17" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif"><tspan>I&#x27;m especially interested in bringing </tspan><tspan class="t" font-weight="700">artificial intelligence</tspan></text><text x="420.0" y="234" text-anchor="middle" fill="#8B8B92" font-size="17" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif"><tspan>into software to make it smarter and more capable.</tspan></text></svg>
