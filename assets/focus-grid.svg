<svg xmlns="http://www.w3.org/2000/svg" width="840" height="254" viewBox="0 0 840 254"><text x="210.0" y="26" text-anchor="middle" fill="#34C997" font-size="19" font-weight="700" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">Reliable Software</text><text x="210.0" y="56" text-anchor="middle" fill="#8B8B92" font-size="15" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">Dependable systems that behave predictably</text><text x="210.0" y="78" text-anchor="middle" fill="#8B8B92" font-size="15" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">in real-world use and stay easy to maintain</text><text x="210.0" y="100" text-anchor="middle" fill="#8B8B92" font-size="15" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">over the long run.</text><text x="630.0" y="26" text-anchor="middle" fill="#34C997" font-size="19" font-weight="700" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">Security by Design</text><text x="630.0" y="56" text-anchor="middle" fill="#8B8B92" font-size="15" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">Secure coding practices and system security</text><text x="630.0" y="78" text-anchor="middle" fill="#8B8B92" font-size="15" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">considered from the first line, not bolted</text><text x="630.0" y="100" text-anchor="middle" fill="#8B8B92" font-size="15" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">on at the end.</text><text x="210.0" y="170" text-anchor="middle" fill="#34C997" font-size="19" font-weight="700" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">Scalable Architecture</text><text x="210.0" y="200" text-anchor="middle" fill="#8B8B92" font-size="15" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">Clear architecture and attention to</text><text x="210.0" y="222" text-anchor="middle" fill="#8B8B92" font-size="15" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">performance, so products stay fast and</text><text x="210.0" y="244" text-anchor="middle" fill="#8B8B92" font-size="15" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">manageable as they grow.</text><text x="630.0" y="170" text-anchor="middle" fill="#34C997" font-size="19" font-weight="700" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">AI-Powered Solutions</text><text x="630.0" y="200" text-anchor="middle" fill="#8B8B92" font-size="15" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">Integrating artificial intelligence into</text><text x="630.0" y="222" text-anchor="middle" fill="#8B8B92" font-size="15" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">software to solve real-world problems with</text><text x="630.0" y="244" text-anchor="middle" fill="#8B8B92" font-size="15" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">smarter applications.</text></svg>
