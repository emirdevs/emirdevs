name: Profile cards

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate emerald cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: emirdevs
          UTC_OFFSET: '0'
        run: node scripts/generate.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards
          git diff --cached --quiet || git commit -m "chore: update profile cards"
          git push
